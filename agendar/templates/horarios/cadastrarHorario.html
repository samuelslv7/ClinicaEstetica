<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Horário</title>
</head>
<body>
    <h1>Cadastre um horário novo aqui!</h1>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    <form action ="" method = "post">
        {% csrf_token %}
        {{form}}
<div style="display: flex; gap: 15px; margin-top: 20px; align-items: center;">
        <input type="submit" value="Enviar" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
        
        <a href="{% url 'agendar:agenda' %}" style="display: inline-block; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
            &larr; Voltar para a Agenda
        </a>
    </div>
    </form>

</body>
</html>
