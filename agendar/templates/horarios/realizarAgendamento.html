<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Realizar Agendamento</title>
        <style>
            * {
                box-sizing: border-box;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
            body {
                background-color: #f4f6f8;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }
            .card {
                background: #ffffff;
                width: 100%;
                max-width: 420px;
                padding: 24px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                border: 1px solid #e1e4e8;
            }
            h2 {
                margin: 0 0 20px 0;
                font-size: 1.3rem;
                color: #24292e;
            }
            .campo {
                margin-bottom: 16px;
            }
            label {
                display: block;
                margin-bottom: 6px;
                font-size: 0.9rem;
                font-weight: 600;
                color: #444d56;
            }
            select,
            input[type="text"] {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #d1d5da;
                border-radius: 6px;
                font-size: 0.95rem;
                outline: none;
                background-color: #fff;
            }
            select:focus,
            input:focus {
                border-color: #0366d6;
            }
            .btn-salvar {
                width: 100%;
                background-color: #2ea44f;
                color: #ffffff;
                border: none;
                padding: 10px;
                font-size: 0.95rem;
                font-weight: 600;
                border-radius: 6px;
                cursor: pointer;
                margin-top: 10px;
            }
            .btn-salvar:hover {
                background-color: #2c974b;
            }
            .btn-cancelar {
                display: block;
                text-align: center;
                margin-top: 12px;
                color: #586069;
                text-decoration: none;
                font-size: 0.85rem;
            }
            .btn-cancelar:hover {
                text-decoration: underline;
            }
            .mensagem {
                padding: 10px;
                border-radius: 6px;
                font-size: 0.85rem;
                margin-bottom: 16px;
                background-color: #dcffe4;
                color: #155724;
                border: 1px solid #c3e6cb;
            }
            .mensagem.error {
                background-color: #ffeef0;
                color: #cb2431;
                border-color: #ffdce0;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Realizar Agendamento</h2>

            {% if messages %} {% for message in messages %}
            <div class="mensagem {{ message.tags }}">{{ message }}</div>
            {% endfor %} {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="campo">{{ form.as_p }}</div>

                <button type="submit" class="btn-salvar">Confirmar Agendamento</button>
                <a href="{% url 'agendar:agenda' %}" class="btn-cancelar">Voltar para a Agenda</a>
            </form>
        </div>
    </body>
</html>
