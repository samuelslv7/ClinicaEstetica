<form action="{% url "agendar:criarcliente" %}" method="post" novalidate>
    {% csrf_token %}
    {{form}}

    <input type="submit" value="Enviar">

</form>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
