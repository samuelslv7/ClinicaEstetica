<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Confirmar Exclusão</title>
        <style>
            * {
                box-sizing: border-box;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
            body {
                background-color: #f4f6f8;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }
            .card {
                background: #fff;
                width: 100%;
                max-width: 420px;
                padding: 24px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                border: 1px solid #e1e4e8;
            }
            h2 {
                margin-top: 0;
                color: #cb2431;
                font-size: 1.3rem;
            }
            p {
                font-size: 0.9rem;
                color: #444d56;
                line-height: 1.5;
            }
            .btn-excluir {
                width: 100%;
                background-color: #cb2431;
                color: #fff;
                border: none;
                padding: 10px;
                font-weight: 600;
                border-radius: 6px;
                cursor: pointer;
            }
            .btn-excluir:hover {
                background-color: #b31d28;
            }
            .btn-cancelar {
                display: block;
                text-align: center;
                margin-top: 12px;
                color: #586069;
                text-decoration: none;
                font-size: 0.85rem;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Confirmar Exclusão</h2>
            <p>
                Tem certeza de que deseja remover o cliente <strong>{{ cliente.nome }}</strong> CPF:( {{cliente.cpf}})?
            </p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn-excluir">Sim, excluir cliente</button>
                <a href="{% url 'agendar:listarclientes' %}" class="btn-cancelar">Cancelar</a>
            </form>
        </div>
    </body>
</html>
