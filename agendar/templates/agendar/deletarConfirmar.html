<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
</head>
<body>

    <h2>Excluir Cliente</h2>

    <div class="alerta">
        <p>Tem certeza de que deseja excluir o cliente <strong>{{ cliente.nome }}</strong> (CPF: {{ cliente.cpf }})?</p>
        <p><em>Atenção: Os agendamentos vinculados a este cliente também serão afetados.</em></p>
    </div>

    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit">
            Sim, confirmar exclusão
        </button>
        <a href="{% url 'agendar:listarclientes' %}" style="margin-left: 10px;">Cancelar</a>
    </form>

</body>
</html>
